name: Build AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Unzip Android project
        run: unzip -q didja-twa.zip -d android-project
      - name: Build unsigned release bundle
        working-directory: android-project/didja-twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --console=plain
      - name: Publish bundle to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-build-${{ github.run_number }}
          name: AAB build ${{ github.run_number }}
          files: android-project/didja-twa/app/build/outputs/bundle/release/*.aab
